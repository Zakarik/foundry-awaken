<form class="flexcol {{cssClass}}" autocomplete="off">
    <header class="sheet-header flexrow">
        <img class="profile-img" src="{{data.img}}" data-edit="img" title="{{data.name}}" />
        <div class="flexcol aData">
            <h1 class="prodigename">
                <input name="name" type="text" value="{{data.name}}" placeholder="{{localize "AWAKEN.Nom"}}" />
                <input name="system.rang" type="number" title="{{localize "AWAKEN.PRODIGES.Rang"}}" value="{{systemData.rang}}" />
            </h1>
            <div class="main">
                <label class="famille">
                    <span>{{localize "AWAKEN.PRODIGES.Famille"}} : </span>
                    <select name="system.famille">
                        {{selectOptions (getSelect "familleProdige") selected=systemData.famille localize=true}}
                    </select>
                </label>

                <select name="system.type" class="type">
                    {{selectOptions (getSelect "typeProdige") selected=systemData.type localize=true}}
                </select>

                <label class="activation">
                    <span>{{localize "AWAKEN.PRODIGES.Activation"}} : </span>
                    <input type="text" name="system.activation" value="{{systemData.activation}}" />
                </label>

                <label class="duree">
                    <span>{{localize "AWAKEN.PRODIGES.Duree"}} : </span>
                    <input type="text" name="system.duree" value="{{systemData.duree}}" />
                </label>
            </div>
        </div>
    </header>
    <div class="description">
        <h2 class="header-mTitle">{{localize "AWAKEN.Description"}}</h2>

        {{editor systemData.description target="system.description" button=true owner=owner editable=editable}}
    </div>
</form>
